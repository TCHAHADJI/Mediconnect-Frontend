<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E3A8A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#medGrad)" filter="url(#shadow)" />

  <!-- Clean inner white background badge -->
  <rect x="76" y="76" width="360" height="360" rx="72" fill="#ffffff" />

  <!-- Medical Cross with subtle gradient -->
  <!-- Horizontal arm -->
  <rect x="156" y="216" width="200" height="80" rx="20" fill="url(#crossGrad)" />
  <!-- Vertical arm -->
  <rect x="216" y="156" width="80" height="200" rx="20" fill="url(#crossGrad)" />

  <!-- Heartbeat / pulse line in center -->
  <path d="M 130 256 L 205 256 L 225 210 L 255 300 L 285 230 L 305 256 L 382 256" 
        fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
</svg>
